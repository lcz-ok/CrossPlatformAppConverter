plugins {
    id 'com.android.application'
}

android {
    namespace 'com.liuchenzhi.polyforge'
    compileSdk 34

    defaultConfig {
        applicationId 'com.liuchenzhi.polyforge'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// 单一源码：根目录 index.html 在构建前同步到 assets
tasks.register('syncWebAssets', Copy) {
    from rootProject.file('../index.html')
    into 'src/main/assets'
}
preBuild.dependsOn syncWebAssets
